name: 🚀 Deploy on push to VPS

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 🔑 Setup SSH for VPS
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # 🔑 Add server host key to known_hosts
      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # 📂 Copy project files to VPS
      - name: Deploy via SCP
        run: |
          rsync -avz --delete \
          --exclude "node_modules" \
          --exclude ".env" \
          ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/staging

      # ⚡ Next.js Production Build & Restart
      - name: Build & Restart PM2
        run: |
          ssh root@${{ secrets.VPS_HOST }} << 'EOF'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            cd /var/www/html
            npm install --frozen-lockfile
            npm run build

            # These three lines are MANDATORY for Standalone mode
            cp -r ./public ./.next/standalone/public || true
            cp -r ./.next/static ./.next/standalone/.next/static || true
            cp .env ./.next/standalone/.env || true

            # Start using the standalone server
            pm2 restart next-app || pm2 start .next/standalone/server.js --name "next-app"
            pm2 save
          EOF
