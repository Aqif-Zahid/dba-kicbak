name: 🚀 Deploy on push to VPS

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 🔑 Setup SSH for VPS
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # 🔑 Add server host key to known_hosts
      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # 📂 Copy project files to VPS
      - name: Deploy via SCP
        run: |
          rsync -avz --delete \
          --exclude "node_modules" \
          --exclude "vendor" \
          --exclude "storage" \
          --exclude ".env" \
          ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/html

      # ⚡ Next.js Production Build & Restart
      - name: Build and Restart App
        run: |
          ssh root@${{ secrets.VPS_HOST }} << 'EOF'
            cd /var/www/html
            
            # Load NVM/Node if not in path (uncomment if needed)
            # export NVM_DIR="$HOME/.nvm"
            # [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "Installing dependencies..."
            npm install --frozen-lockfile

            echo "Running Database Migrations..."
            # Uncomment the one you use:
            npx prisma migrate deploy
            # npx drizzle-kit migrate

            echo "Building Next.js application..."
            npm run build

            echo "Restarting PM2 process..."
            # This will restart the app, or start it if it's not running
            pm2 restart staging-kicbak || pm2 start npm --name "staging-kicbak" -- start
            
            pm2 save
            echo "Deployment Complete!"
          EOF