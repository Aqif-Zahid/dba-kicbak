name: 🚀 Deploy & Build on VPS

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync Files & Build on VPS
        run: |
          ssh root@${{ secrets.VPS_HOST }} << 'EOF'
            cd /var/www/html
            
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            npm install --frozen-lockfile --prefer-offline

            npx prisma generate

            NODE_OPTIONS="--max-old-space-size=512" npm run build

            cp -r ./public ./.next/standalone/public || true
            cp -r ./.next/static ./.next/standalone/.next/static || true

            pm2 restart staging-kicbak || pm2 start .next/standalone/server.js --name "staging-kicbak"
            pm2 save
          EOF