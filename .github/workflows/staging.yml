name: 🚀 Deploy on push to VPS

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 🔑 Setup SSH for VPS
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # 🔑 Add server host key to known_hosts
      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # 📂 Copy project files to VPS
      - name: Deploy via SCP
        run: |
          rsync -avz --delete \
          --exclude "node_modules" \
          --exclude "vendor" \
          --exclude "storage" \
          --exclude ".env" \
          ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/html

      # ⚡ Run Node commands on VPS
      - name: Run SSH commands
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /var/www/html
