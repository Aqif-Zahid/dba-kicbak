name: 🚀 Build on GitHub & Deploy

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        # We build the 'standalone' folder here on GitHub's powerful servers
        run: |
          npm install --frozen-lockfile
          npm run build
        env:
          # Next.js needs these at build time
          NEXT_PRIVATE_STANDALONE: true 

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Standalone to VPS
        # We ONLY send the necessary production files (~5-20MB instead of 500MB)
        run: |
          # Copy the standalone folder, static files, and public files
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=yes" \
          ./.next/standalone/ \
          ./.next/static/ \
          ./public/ \
          root@${{ secrets.VPS_HOST }}:/var/www/html/

      - name: Restart PM2 on VPS
        run: |
          ssh root@${{ secrets.VPS_HOST }} << 'EOF'
            cd /var/www/html
            # Ensure PM2 points to the standalone server.js
            pm2 restart next-app || pm2 start server.js --name "next-app"
            pm2 save
          EOF